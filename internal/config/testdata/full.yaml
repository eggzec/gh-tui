repos:
  - eggzec/gh-tui
  - cli/cli

theme: dusk
themes:
  dusk:
    light:
      accent: "#8a4fbf"
      foreground: "#222222"
      muted: "#555555"
      subtle: "#888888"
      border: "#dddddd"
      success: "#2f7d4f"
      warning: "#9a6700"
      error: "#c0392b"
    dark:
      accent: "#c39bf0"
      foreground: "#e0e0e0"
      muted: "#aaaaaa"
      subtle: "#777777"
      border: "#444"
      success: "#7fc99a"
      warning: "#e5c07b"
      error: "#ef7d7d"

keys:
  global:
    quit: [Q]
    search: ["ctrl+k", "ctrl+o"]

cache:
  ttl:
    pulls: 1m
    issues: 2m
    notifications: 3m
    repos: 4m
    dashboard_repos: 30m
    waiting_on_you: 6m
    repo_info: 2h
    files: 7m
    history: 8m
    compare: 1m
    actions: 9m
    actions_running: 20s
    filters: 10m
    search: 40s
    code_search: 2m
    releases: 3h
    references: 6m
    profile: 4h
    contributions: 12h
    people: 2h
    readme: 3h
  memory:
    entries: 512
    files: 16MiB
    trees: 24MiB
    diffs: 8MiB
    logs: 128MiB
  disk:
    enabled: false
    entries: false
    dir: /var/cache/gh-tui
    max_size: 1GiB
    compression: none
    compression_level: best
  revalidate:
    enabled: false
    interval: 5m
    per_minute: 30
    scope: all
    recent: 24h

sync:
  enabled: false
  poll:
    notifications: 2m
    lists: 3m
    actions: 20s
    checks: 30s
  unfocused_slowdown: 2

files:
  preview:
    max_size: 2000000
  finder:
    preview: false
  markdown: raw

prefetch:
  enabled: false
  window: {before: 2, after: 6}
  rest: 1s
  parallel: 2
  pulls:
    other_tabs: {enabled: false}
  files:
    rest: 300ms
    preview: {enabled: false, max_size: 16KiB}
  finder:
    preview: {window: {before: 1, after: 2}, max_size: 8KiB}
  history:
    window: {before: 5, after: 5}
    rest: 250ms

notifications:
  mark_read_on_open: false

history:
  row: [short_sha, subject, verified, age]
  detail: [sha, author, date, trailers]
  show_email: true

dashboard:
  calendar_glyph: "#"
  contributions: year

owner:
  default_tab: people

ui:
  icons: unicode
  toast:
    info: 6s
  date_format: "2006-01-02 15:04"

images:
  enabled: "off"
  max_rows: 8
  avatars: false
  animate: false

auth:
  check: false

github:
  timeout: 1m
  concurrency: 4

page_size:
  pulls: 50
  issues: 40
  notifications: 20
  repos: 60
  runs: 25
  commits: 100
  search: 10
  waiting_on_you: 15
  people: 40
  references: 50

commands:
  history: 500

log:
  level: debug
  file: /var/log/gh-tui.log
  max_size: 1MiB
  keep: 5
  summary: 1m

editor: code --wait
