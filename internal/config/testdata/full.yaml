repos:
  - eggzec/gh-tui
  - cli/cli

theme: dusk
themes:
  dusk:
    light:
      accent: "#8a4fbf"
      foreground: "#222222"
      muted: "#555555"
      subtle: "#888888"
      border: "#dddddd"
      success: "#2f7d4f"
      warning: "#9a6700"
      error: "#c0392b"
    dark:
      accent: "#c39bf0"
      foreground: "#e0e0e0"
      muted: "#aaaaaa"
      subtle: "#777777"
      border: "#444"
      success: "#7fc99a"
      warning: "#e5c07b"
      error: "#ef7d7d"

keys:
  quit: [x]
  search: ["/", "ctrl+f"]

cache:
  ttl: 30s
  disk:
    enabled: false
    entries: false
    dir: /var/cache/gh-tui
    max_size: 1GiB
    compression: none
    compression_level: best
  revalidate:
    enabled: false
    interval: 5m
    budget: 30
    scope: all

sync:
  enabled: false
  interval: 2m

files:
  prefetch:
    enabled: false
    max_size: 16KiB
    hover_delay: 300ms
  preview:
    max_size: 2000000

details:
  prefetch:
    enabled: false
    rows: 10
    hover_delay: 1s

history:
  row: [short_sha, subject, verified, age]
  detail: [sha, author, date, trailers]
  date_format: "2006-01-02 15:04"
  show_email: true
  prefetch:
    around: 5
    hover_delay: 250ms

dashboard:
  calendar_glyph: "#"

log:
  level: debug
  file: /var/log/gh-tui.log
  max_size: 1MiB
  keep: 5
  summary: 1m
