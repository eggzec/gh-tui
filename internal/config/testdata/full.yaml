repos:
  - eggzec/gh-tui
  - cli/cli

theme: dusk
themes:
  dusk:
    light:
      accent: "#8a4fbf"
      foreground: "#222222"
      muted: "#555555"
      subtle: "#888888"
      border: "#dddddd"
      success: "#2f7d4f"
      warning: "#9a6700"
      error: "#c0392b"
    dark:
      accent: "#c39bf0"
      foreground: "#e0e0e0"
      muted: "#aaaaaa"
      subtle: "#777777"
      border: "#444"
      success: "#7fc99a"
      warning: "#e5c07b"
      error: "#ef7d7d"

keys:
  quit: [x]
  search: ["/", "ctrl+f"]

cache:
  ttl: 30s
  disk:
    enabled: false
    entries: false
    dir: /var/cache/gh-tui
    max_size: 1GiB
    compression: none
    compression_level: best
  revalidate:
    enabled: false
    interval: 5m
    budget: 30
    scope: all

sync:
  enabled: false
  poll:
    notifications: 2m
    lists: 3m
    actions: 20s
    checks: 30s
  unfocused_slowdown: 2

files:
  preview:
    max_size: 2000000
  finder:
    preview: false

details:
  prefetch:
    enabled: false
    rows: 10
    hover_delay: 1s
    filters: false

notifications:
  mark_read_on_open: false

history:
  row: [short_sha, subject, verified, age]
  detail: [sha, author, date, trailers]
  show_email: true

prefetch:
  files:
    rest: 300ms
    preview: {enabled: false, max_size: 16KiB}
  finder:
    preview: {window: {before: 1, after: 2}, max_size: 8KiB}
  history:
    window: {before: 5, after: 5}
    rest: 250ms

dashboard:
  calendar_glyph: "#"
  contributions: year
  prefetch: false

ui:
  icons: unicode
  toast:
    info: 6s
    error: 12s
  date_format: "2006-01-02 15:04"

images:
  enabled: "off"
  max_rows: 8
  avatars: false
  animate: false

auth:
  check: false

github:
  timeout: 1m
  concurrency: 4

page_size:
  pulls: 50
  issues: 40
  notifications: 20
  repos: 60
  runs: 25
  commits: 100
  search: 10
  waiting_on_you: 15

commands:
  history: 500

log:
  level: debug
  file: /var/log/gh-tui.log
  max_size: 1MiB
  keep: 5
  summary: 1m

editor: code --wait
