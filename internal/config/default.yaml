# gh-tui's defaults: every setting and its default value.
#
# Your config file, $GH_TUI_CONFIG or gh-tui/config.yaml in your config
# directory ($XDG_CONFIG_HOME on Linux), goes over this file. Write only
# what you change:
#
#   - a mapping merges key by key, so setting one key, one action of keys,
#     or one colour of a theme leaves the others as they are here;
#   - a list replaces the whole list here, so write every item you want;
#   - an empty value, such as "editor:" with nothing after it, is refused:
#     to keep a default, remove the line.
#
# Hex colours must be quoted, since an unquoted # starts a comment.
# Durations read like 150ms, 30s, 5m or 1h, and sizes like 64KiB or 1MB:
# B, kB, MB and GB count in powers of 1000, KiB, MiB and GiB in powers of
# 1024.

# Your pinned repositories, as owner/name.
repos: []

# The active theme: one of themes, below.
theme: default

# The command of the editor that v opens a file in from the pager, such as
# vim or "code --wait": a program and its arguments, split at white space
# and run without a shell. Empty takes $VISUAL, and else $EDITOR.
editor: ""

ui:
  # The glyphs that mark repositories, languages and the states of issues
  # and pull requests: nerd, which needs a Nerd Font and marks the types
  # of files too, unicode, or ascii.
  icons: nerd
  # How long a toast stays before it goes on its own, at least 1s: info
  # for info, success and warnings, and error for errors, which take
  # longer to read.
  toast:
    info: 4s
    error: 8s
  # How every date reads, in the lists, the modals and the history:
  # relative, as an age (3d in a row, 3d ago in a sentence), absolute
  # (2006-01-02 15:04 MST), or a Go time layout such as "2006-01-02 15:04".
  date_format: relative

# Images drawn inline, such as avatars and the images of comments, with
# kitty's graphics protocol. Only kitty 0.28 or newer and Ghostty show them
# as the app draws them, directly or through tmux 3.3 or newer with
# allow-passthrough on, and only with 256 colours or more and NO_COLOR
# unset. Elsewhere an image stays a link.
images:
  # auto draws images when the terminal names itself as one of those and
  # then answers kitty's graphics query; on still needs the terminal to
  # name itself as one of those, and only skips the graphics query, for
  # one that doesn't answer it; off never draws them or asks.
  enabled: auto
  # The tallest an image may be, in rows, and never taller than the pane.
  max_rows: 20
  # Draw the avatars of people, and of the owners of repositories as their
  # icons.
  avatars: true
  # Play animated GIFs where the terminal can, which only kitty does;
  # elsewhere, and when this is off, a GIF shows its first frame.
  animate: true

cache:
  # How long what was read of each kind of data is shown without asking
  # GitHub again. After that it is read again, usually with a conditional
  # request that costs nothing against the rate limit when nothing changed.
  ttl:
    # The lists and details of pull requests, and their comments.
    pulls: 5m
    # The lists and details of issues, and their comments.
    issues: 5m
    notifications: 5m
    # The lists of repositories: the search screen's start, an owner's
    # repositories and the completion of :goto.
    repos: 5m
    # The dashboard's Repositories pane, which lists every owner's
    # repositories and costs more to read again.
    dashboard_repos: 15m
    # The dashboard's pull requests and issues that wait on you.
    waiting_on_you: 5m
    # One repository's details, such as its default branch and whether it
    # is private.
    repo_info: 1h
    # Where branches point. The files of a commit never go stale.
    files: 5m
    # Branches and the commits of a branch. A commit itself never goes
    # stale.
    history: 5m
    # Comparisons of two refs.
    compare: 30s
    # Workflow runs, finished jobs and checks.
    actions: 5m
    # The jobs of a run that is still going.
    actions_running: 10s
    # The labels, milestones and people the filters offer.
    filters: 5m
    search: 30s
    code_search: 1m
    releases: 1h
    # The dashboard's header: you, your organizations and your pinned
    # repositories.
    profile: 1h
    contributions: 6h
  # What gh-tui keeps in memory. These may only be set at the top level,
  # not for one host or profile.
  memory:
    # How many entries each kind of data keeps, such as the pages of pull
    # requests, or the files read.
    entries: 1024
    # The memory that the contents of files take.
    files: 32MiB
    # The memory that the changes of commits take.
    diffs: 32MiB
    # The memory that the logs of jobs take.
    logs: 64MiB
  # The disk cache keeps what doesn't change, such as the files of a
  # commit, across sessions, and where branches pointed, so that a new
  # session asks GitHub only whether they moved.
  disk:
    enabled: true
    # Keep lists and details too, such as pull requests, issues and
    # notifications, apart for each account, so that a new session shows
    # them at once while it asks GitHub whether they changed.
    entries: true
    # The cache directory, an absolute path. Empty means gh-tui in your
    # cache directory ($XDG_CACHE_HOME on Linux).
    dir: ""
    # The space the cache may take on disk, for each host. When it takes
    # more at startup, the objects used least recently go. At least 8MiB.
    max_size: 512MiB
    # How new objects are stored: gzip or none. Objects stored either way
    # stay readable.
    compression: gzip
    # The time gzip takes against the space it saves: fastest, default or
    # best.
    compression_level: default
  # Checking cached entries in the background, such as the lists, issues
  # and branches kept on disk, with one conditional request each, so that
  # what a view reads is known to be current and needs no request when it
  # loads. A request that finds nothing changed is free against GitHub's
  # rate limit, but not against its limits on how many requests come at
  # once, hence per_minute.
  revalidate:
    enabled: true
    # How often a pass over the entries starts. A pass checks at most what
    # per_minute allows in an interval. At least 10s.
    interval: 2m
    # How many requests a minute the checks send at most, 1 to 300. It
    # shrinks while the terminal is unfocused.
    per_minute: 60
    # Which entries are checked: recent, those of the selected repository
    # and those used within recent, below, or all.
    scope: recent
    # How recently an entry must have been used for the recent scope to
    # check it.
    recent: 168h

# Polling for changes in the background.
sync:
  enabled: true
  # How often each thing on view is polled, when the server doesn't ask
  # for a longer interval. Each is at least 10s.
  poll:
    # The inbox.
    notifications: 1m
    # The pull requests and issues of the repository on view.
    lists: 1m
    # A workflow run in progress, in the Actions modal or a pull request's
    # checks.
    actions: 10s
    # A pull request's checks while some are pending.
    checks: 15s
  # How much slower the polls and the revalidation of the cache go while
  # the terminal is unfocused, 1 to 60. 1 doesn't slow them down.
  unfocused_slowdown: 4

# The Files pane.
files:
  preview:
    # The largest file the preview reads, at most 100MiB. Larger files are
    # better opened in the browser.
    max_size: 1MiB
  finder:
    # Show the content of the selected file beside the paths, where the
    # finder is at least 100 columns wide. Tab shows or hides it either
    # way.
    preview: true

# The notifications screen and the dashboard's inbox.
notifications:
  # Mark a thread read when the select key opens what it is about, in the
  # app or in the browser. The open key, which opens the thread on GitHub,
  # never marks it read.
  mark_read_on_open: true

# The History modal: the branches of the repository, the graph of one of
# them, and the commit under the graph's cursor.
history:
  # What each row of the graph shows, in this order within its place: the
  # short SHA first, then the subject, then the rest after it, and the age
  # or date at the right edge. Choose from short_sha, subject, author,
  # committer, age, date, verified and trailers. The author and the
  # committer show the GitHub login, or the name without one; age is how
  # long ago the commit was authored, such as 3d; verified marks a
  # verified signature with ✓, and one GitHub couldn't verify with ✗;
  # trailers counts the co-authors.
  row: [short_sha, subject, author, age]
  # What the header of the commit pane shows, in this order. Choose from
  # sha, author, committer, date, verification, parents, trailers, body
  # and stats. When it lists both the author and the committer and they
  # are the same person, with the same name and email, they share one
  # line, where the author is listed; list only one of them to always
  # show just that one.
  detail: [sha, author, committer, date, verification, parents, trailers, body, stats]
  # Show the git email next to each name, and in trailers such as
  # Co-authored-by.
  show_email: false

# The dashboard, the screen the app opens on.
dashboard:
  # The cell of a day in the contribution calendar. It must be one cell
  # wide; some terminals draw ■ two cells wide, and "▪" or "#" suit them
  # better.
  calendar_glyph: "■"
  # How far back the contribution calendar goes: 30d, 90d or year. Its
  # total counts the days it shows.
  contributions: 90d

# Reading ahead: what the app reads before you open it, so that it opens
# at once. It's a guess, and it spends quota; what was read is kept in the
# cache either way. It has three layers, each setting only what it names:
# these global knobs, then prefetch.<page>, then prefetch.<page>.<kind>,
# one kind of item on that page. A knob a layer leaves out comes from the
# layer above, so enabled: false here turns off every page and kind that
# doesn't enable itself. The pages below that set a window of their own
# (search, finder, history and actions) don't follow the window set here;
# set one of their knobs to null to hand it back to the layer above.
prefetch:
  # Whether anything is read ahead.
  enabled: true
  # The rows around the cursor read once it rests, besides the row under
  # it: before above it, after below it, each 0 to 30. Nearest rows go
  # first, and below before above. 0/0 reads the row under the cursor only.
  window: {before: 1, after: 4}
  # How long the cursor stays on a row before anything is read for it, up
  # to 2s. The window is read again each time it rests.
  rest: 150ms
  # The most reads ahead of rows around the cursors in flight at once, on
  # top of yours, 1 to 10, for every page and modal together. Set here, not
  # per page or kind, since they all share the connection.
  parallel: 3
  # The percent of each hourly quota, GraphQL points and REST requests
  # alike, that reads ahead may spend, 1 to 50. Once they spent it, nothing
  # is read ahead until that quota refills. Apart from it, reads ahead stop
  # while less than 10% of a quota is left, when the status bar turns to
  # warn of it. Global only.
  budget: 10
  # The pages, and the kinds of items on them. Each may set enabled,
  # window and rest. Kinds that read a page at a time (other_tabs,
  # other_kinds) take no window.
  #   pulls: details, comments, checks, other_tabs
  #   issues: details, comments, other_tabs
  #   notifications: details, comments
  #   dashboard: waiting_on_you, inbox, repositories, pinned
  #   search: details, comments, other_kinds
  #   files: tree, preview (window up to 64)
  #   finder: preview
  #   history: commits, branches (windows up to 10)
  #   actions: jobs, logs
  pulls:
    # The full check list of a row costs a GraphQL query, and the rows
    # show how their checks stand already, so it is off. Checks read in
    # the last cache.ttl.actions aren't read again, even while some are
    # pending, unless the row shows a new head; the Checks step polls
    # pending checks once it opens.
    checks: {enabled: false, window: {before: 0, after: 2}}
  dashboard:
    # Waiting on you is read while its pane has the focus, and the inbox
    # while the dashboard is on view. A row costs two requests, the detail
    # and its first comments.
    waiting_on_you: {window: {before: 1, after: 2}}
    # The repositories and pinned panes read, while each has the focus,
    # what opening the repositories around the cursor reads first: the
    # repository and the listing of its default branch, about three
    # requests a repository, and a listing can run to megabytes, so they
    # are off. The repository under the cursor is read only when it is
    # opened. The pinned cards count in the order the pane lists them.
    repositories: {enabled: false, window: {before: 1, after: 1}}
    pinned: {enabled: false, window: {before: 1, after: 1}}
  search:
    window: {before: 0, after: 0}
    other_kinds: {rest: 700ms}
  files:
    tree: {enabled: false}
    preview:
      window: {before: 0, after: 32}
      # The largest file read around the cursor, at most
      # files.preview.max_size. The file under the cursor is read up to
      # files.preview.max_size.
      max_size: 64KiB
  finder:
    window: {before: 0, after: 0}
    rest: 100ms
    # The finder's preview always reads the file under its cursor, up to
    # files.preview.max_size; max_size bounds the files read around it.
    preview: {max_size: 64KiB}
  history:
    window: {before: 3, after: 3}
    branches: {window: {before: 0, after: 0}}
  actions:
    # The jobs of the runs around the cursor of the runs: a request a run,
    # or more for a run of over 100 jobs, and none again for a run that
    # ended, whose jobs are kept.
    window: {before: 1, after: 2}
    # The logs of the jobs around the cursor of the jobs: the window counts
    # rows, and only the failed jobs that ended among them are read. A log
    # can run to megabytes, so they are off. The log of the job under the
    # cursor is read once it rests, whatever this says.
    logs: {enabled: false, window: {before: 0, after: 2}}

# What the app checks of the token.
auth:
  # Refuse at once what the token is known to lack a scope for, rather
  # than asking GitHub, and ask GitHub what the token may do when no
  # answer said so soon after the start. Turn it off if the app ever
  # refuses what the token may do.
  check: true

# How the app talks to GitHub.
github:
  # How long one attempt at a request may take, from sending it until
  # its answer is read, before it is sent again or fails. At least 1s; a
  # server behind a slow VPN may need longer.
  timeout: 30s
  # How many requests are in flight at once at most, 3 to 16. Two of them
  # are kept for what you wait for, so reads ahead never hold those up.
  # A server with tight limits on requests at once wants fewer.
  concurrency: 8

# How many items each page read from GitHub holds, 10 to 100. Smaller
# pages show sooner on a slow connection; larger ones take fewer requests.
page_size:
  # Pull requests, and their comments and reviews.
  pulls: 30
  # Issues, and their comments.
  issues: 30
  notifications: 30
  # Your repositories.
  repos: 30
  # The workflow runs of the Actions modal.
  runs: 30
  # The commits of the History modal.
  commits: 50
  # Each kind of search result.
  search: 20
  # Each list of Waiting on you on the dashboard; its counts cover them
  # all.
  waiting_on_you: 10

# The command line.
commands:
  # How many of the lines you typed are remembered for each account,
  # across sessions, 1 to 10000.
  history: 100

# The log file, which holds one JSON object per line. The app owns the
# terminal, so nothing is logged anywhere else.
log:
  # The least level logged: debug, info, warn or error. GH_TUI_LOG,
  # --debug and GH_DEBUG override it for one run.
  level: info
  # The log file, an absolute path. Empty means gh-tui/gh-tui.log in your
  # state directory: $XDG_STATE_HOME, or ~/.local/state, also on macOS,
  # and %LocalAppData% on Windows.
  file: ""
  # How large the file grows before it is rotated. At least 64KiB.
  max_size: 10MiB
  # How many rotated files are kept, 0 to 100.
  keep: 3
  # How often a summary of the requests, the caches and the reads ahead is
  # logged. Zero turns these off; one is still logged on exit. Otherwise
  # at least 10s.
  summary: 5m

# The keys of each action, as the terminal names them, such as ctrl+c,
# shift+tab or space. Setting an action replaces its keys only. A key may
# serve different actions in different places, such as m for merge in
# pull requests and mark read in the notifications.
keys:
  quit: [q, ctrl+c]
  help: ["?"]
  refresh: [r, ctrl+r]
  search: [/]
  # Cycle the focus through the panes of the screen. They keep the names
  # they had when the app had tabs.
  next_tab: [tab, "]"]
  prev_tab: [shift+tab, "["]
  open_in_browser: [o]
  # Focus the pane with that number on the screen: files, pull requests
  # and issues on the repository screen, and pinned, repositories, work,
  # contributions and notifications on the dashboard.
  pane_1: ["1"]
  pane_2: ["2"]
  pane_3: ["3"]
  pane_4: ["4"]
  pane_5: ["5"]
  # Switch between the screen on view and the notifications.
  notifications: [n]
  # Show the dashboard, from any screen. 0 sits before the pane keys, as
  # the dashboard comes before the repository, and no section binds it.
  dashboard: ["0"]
  # Open the History modal of the repository screen.
  history: [B]
  # Show the files at the head of the default branch again, after
  # use_as_base chose another base.
  reset_base: [H]
  # Open the Actions modal of the repository screen.
  actions: [a]
  # Open the file finder of the repository screen, which finds a file by
  # some letters of its path. t is the key of github.com's file finder,
  # and ctrl+p that of editors.
  find_file: [t, ctrl+p]
  # Open the command line at the bottom of the screen, where commands such
  # as goto are typed. As in vim.
  command: [":"]

  select: [enter]
  back: [esc]
  # Open the filter modal of the focused list where it has one, on its
  # Filters tab; sort opens it on its Sort tab, in a list that can be
  # sorted; clear_filter puts the filters of a list back to its defaults.
  filter: [f]
  sort: [s]
  clear_filter: [F]
  merge: [m]
  close: [x]
  reopen: [X]
  toggle_draft: [D]
  mark_read: [m]
  mark_done: [d]
  mark_all_read: [M]
  # Star the repository, or unstar it. Reserved, with its key, and does
  # nothing yet.
  star: [S]
  comment: [c]
  label: [l]
  # The file tree.
  expand: [+]
  collapse: ["-"]
  expand_all: ["*"]
  collapse_all: [=]
  # Show the files at the branch or commit under the cursor of the
  # History modal.
  use_as_base: [space]
  # Switch the repositories of the dashboard between your own and those
  # of each organization.
  next_owner: ["]", right]
  prev_owner: ["[", left]
  # Open the repository of the current directory from the dashboard.
  current_repo: [.]
  # Show the repository of the search result under the cursor, where
  # enter previews the result over the search.
  go_to_repo: [ctrl+o]
  # Switch between the tabs of a list, such as All, Failing, Running and
  # Mine of the Actions modal, and the states of the pull requests and the
  # issues.
  next_filter: ["]"]
  prev_filter: ["["]
  # Move the focus to the pane on the left or right, in a modal with panes
  # such as Actions.
  pane_left: [h]
  pane_right: [l]
  # Show the focused pane of the dashboard, the repository screen, or a
  # modal such as Actions, alone, or all of them again.
  zoom: [z]
  # The Actions modal: re-run the failed jobs of a run, all of them, or
  # the job under the cursor, and cancel a run.
  rerun_failed: [ctrl+r]
  rerun: [R]
  rerun_job: [J]
  cancel_run: [x]
  # Move the focus between the annotations of a failed job and its log.
  annotations: [A]
  # Show the checks of a pull request, in its modal.
  checks: [C]

# Named palettes, each with a variant for light and dark terminals. A
# theme you add needs every colour of both variants; to change the default
# theme, set only the colours you change. The colours: accent marks the
# focused element, selections and links; foreground is the main text;
# muted is for secondary text such as metadata; subtle for the faintest
# text, such as hints and placeholders; border for borders and separators.
themes:
  default:
    light:
      accent: "#3b63c4"
      foreground: "#1f2330"
      muted: "#545b6e"
      subtle: "#8a90a0"
      border: "#d3d7e0"
      success: "#2f7d4f"
      warning: "#9a6700"
      error: "#c0392b"
    dark:
      accent: "#7aa2f7"
      foreground: "#d8dce6"
      muted: "#a0a7b8"
      subtle: "#6b7285"
      border: "#3a3f4d"
      success: "#7fc99a"
      warning: "#e5c07b"
      error: "#ef7d7d"

# Settings for one host, or one account, go over the ones above. Under
# hosts, by the host as gh names it, set what differs on that host; under
# profiles, set what differs for the accounts, login@host, a profile
# lists. The profile of the account gh is logged in as applies, and goes
# over its host's settings. It is picked once, at startup, by the login
# gh stores the token for. A token from GH_TOKEN, GITHUB_TOKEN or
# GH_ENTERPRISE_TOKEN names no login, so gh-tui asks GitHub whose it is
# and keeps the answer in the disk cache: the first start with such a
# token applies no profile, and the next starts apply the login's. A
# profile picks a theme by name, and the theme itself is defined at the
# top level:
#
#   themes:
#     work:
#       light: {accent: "#7c4dbd", …}
#       dark: {accent: "#b39ddb", …}
#   hosts:
#     ghe.corp.com:
#       repos: [platform/api, platform/web]
#   profiles:
#     work:
#       accounts: [ali-corp@ghe.corp.com]
#       theme: work
#
# keys, themes, log, editor, images, commands, ui.icons and cache.disk's
# dir, max_size, compression and compression_level are the same
# everywhere, so they are set only at the top level.
