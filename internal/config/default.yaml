# gh-tui's defaults: every setting and its default value.
#
# Your config file, $GH_TUI_CONFIG or gh-tui/config.yaml in your config
# directory ($XDG_CONFIG_HOME on Linux), goes over this file. Write only
# what you change:
#
#   - a mapping merges key by key, so setting one key, one action of keys,
#     or one colour of a theme leaves the others as they are here;
#   - a list replaces the whole list here, so write every item you want;
#   - an empty value, such as "editor:" with nothing after it, is refused:
#     to keep a default, remove the line.
#
# Hex colours must be quoted, since an unquoted # starts a comment.
# Durations read like 150ms, 30s, 5m or 1h, and sizes like 64KiB or 1MB:
# B, kB, MB and GB count in powers of 1000, KiB, MiB and GiB in powers of
# 1024.

# Your pinned repositories, as owner/name.
repos: []

# The active theme: one of themes, below.
theme: default

# The command of the editor that v opens a file in from the pager, such as
# vim or "code --wait": a program and its arguments, split at white space
# and run without a shell. Empty takes $VISUAL, and else $EDITOR.
editor: ""

ui:
  # The glyphs that mark repositories, languages and the states of issues
  # and pull requests: nerd, which needs a Nerd Font and marks the types
  # of files too, unicode, or ascii.
  icons: nerd
  # How long a toast stays before it goes on its own, at least 1s: info
  # for info, success and warnings. An error stays until it is dismissed
  # with the dismiss key.
  toast:
    info: 4s
  # How every date reads, in the lists, the modals and the history:
  # relative, as an age (3d in a row, 3d ago in a sentence), absolute
  # (2006-01-02 15:04 MST), or a Go time layout such as "2006-01-02 15:04".
  date_format: relative
  # The modals that open filling the screen, each by the name of its key
  # context: pull_modal, issue_modal, release_modal, history, actions,
  # preview, text and filter. The maximize key toggles the one that is
  # open, whichever way it opened.
  maximized: []

# Images drawn inline, such as avatars and the images of comments, with
# kitty's graphics protocol. Only kitty 0.28 or newer and Ghostty show them
# as the app draws them, directly or through tmux 3.3 or newer with
# allow-passthrough on, and only with 256 colours or more and NO_COLOR
# unset. Elsewhere an image stays a link. The :images command says whether
# they are drawn, and why.
images:
  # auto draws images when the terminal names itself as one of those and
  # then answers kitty's graphics query; on still needs the terminal to
  # name itself as one of those, and only skips the graphics query, for
  # one that doesn't answer it; off never draws them or asks.
  enabled: auto
  # The tallest an image may be, in rows, and never taller than the pane.
  max_rows: 20
  # Draw the avatars of people, and of the owners of repositories as their
  # icons.
  avatars: true
  # Play animated GIFs where the terminal can, which only kitty does;
  # elsewhere, and when this is off, a GIF shows its first frame.
  animate: true

cache:
  # How long what was read of each kind of data is shown without asking
  # GitHub again. After that it is read again, usually with a conditional
  # request that costs nothing against the rate limit when nothing changed.
  ttl:
    # The lists and details of pull requests, and their comments.
    pulls: 5m
    # The lists and details of issues, and their comments.
    issues: 5m
    notifications: 5m
    # The lists of repositories: the search screen's start, an owner's
    # repositories and the completion of :goto.
    repos: 5m
    # The dashboard's Repositories pane, which lists every owner's
    # repositories and costs more to read again, and the repositories and
    # stars of a user or organization page.
    dashboard_repos: 15m
    # The dashboard's pull requests and issues that wait on you.
    waiting_on_you: 5m
    # One repository's details, such as its default branch and whether it
    # is private.
    repo_info: 1h
    # Where branches point. The files of a commit never go stale.
    files: 5m
    # Branches and the commits of a branch. A commit itself never goes
    # stale.
    history: 5m
    # Comparisons of two refs.
    compare: 30s
    # Workflow runs, finished jobs and checks.
    actions: 5m
    # The jobs of a run that is still going.
    actions_running: 10s
    # The labels, milestones and people the filters offer.
    filters: 5m
    search: 30s
    code_search: 1m
    releases: 1h
    # The issues and pull requests that a pull request or issue links, and
    # those that mention it. GitHub has no validators for them, so one that
    # is stale is read again in full.
    references: 5m
    # The dashboard's header: you, your organizations and your pinned
    # repositories; and the header of a user or organization page, with
    # its pins and an organization's follower count.
    profile: 1h
    # The contribution calendar, on the dashboard and on the page of a
    # user.
    contributions: 6h
    # The people of a user or organization page: followers, following,
    # organizations, members, teams, sponsors and those sponsored.
    people: 1h
    # The profile READMEs of user and organization pages. Each has an
    # ETag, so checking it again is free.
    readme: 1h
  # What gh-tui keeps in memory. These may only be set at the top level,
  # not for one host or profile.
  memory:
    # How many entries each kind of data keeps, such as the pages of pull
    # requests, or the files read.
    entries: 1024
    # The memory that the contents of files take.
    files: 32MiB
    # The memory that listings of files take: the directories browsed and
    # the list of every path of a commit that the file finder searches.
    # A listing of a large repository, such as one of 100,000 files, takes
    # about 20MiB, so this keeps one of those beside the directories around
    # it, and a few listings of repositories of ordinary size. The listings
    # read by a ref and those read by a SHA are kept apart, each up to this
    # much, so together they take up to twice it.
    trees: 32MiB
    # The memory that the changes of commits take, and likewise, apart
    # from them, the changes of pull requests: each is kept up to this much.
    diffs: 32MiB
    # The memory that the logs of jobs take.
    logs: 64MiB
  # The disk cache keeps what doesn't change, such as the files of a
  # commit, across sessions, and where branches pointed, so that a new
  # session asks GitHub only whether they moved.
  disk:
    enabled: true
    # Keep lists and details too, such as pull requests, issues and
    # notifications, apart for each account, so that a new session shows
    # them at once while it asks GitHub whether they changed.
    entries: true
    # The cache directory, an absolute path. Empty means gh-tui in your
    # cache directory ($XDG_CACHE_HOME on Linux).
    dir: ""
    # The space the cache may take on disk, for each host. When it takes
    # more at startup, the objects used least recently go. At least 8MiB.
    max_size: 512MiB
    # How new objects are stored: gzip or none. Objects stored either way
    # stay readable.
    compression: gzip
    # The time gzip takes against the space it saves: fastest, default or
    # best.
    compression_level: default
  # Checking cached entries in the background, such as the lists, issues
  # and branches kept on disk, with one conditional request each, so that
  # what a view reads is known to be current and needs no request when it
  # loads. A request that finds nothing changed is free against GitHub's
  # rate limit, but not against its limits on how many requests come at
  # once, hence per_minute.
  revalidate:
    enabled: true
    # How often a pass over the entries starts. A pass checks at most what
    # per_minute allows in an interval. At least 10s.
    interval: 2m
    # How many requests a minute the checks send at most, 1 to 300. It
    # shrinks while the terminal is unfocused.
    per_minute: 60
    # Which entries are checked: recent, those of the selected repository
    # and those used within recent, below, or all.
    scope: recent
    # How recently an entry must have been used for the recent scope to
    # check it.
    recent: 168h

# Polling for changes in the background.
sync:
  enabled: true
  # How often each thing on view is polled, when the server doesn't ask
  # for a longer interval. Each is at least 10s.
  poll:
    # The inbox.
    notifications: 1m
    # The pull requests and issues of the repository on view.
    lists: 1m
    # A workflow run in progress, in the Actions modal or a pull request's
    # checks.
    actions: 10s
    # A pull request's checks while some are pending.
    checks: 15s
  # How much slower the polls and the revalidation of the cache go while
  # the terminal is unfocused, 1 to 60. 1 doesn't slow them down.
  unfocused_slowdown: 4

# The Files pane.
files:
  preview:
    # The largest file the preview reads, at most 100MiB. Larger files are
    # better opened in the browser.
    max_size: 1MiB
  finder:
    # Show the content of the selected file beside the paths, where the
    # finder is at least 100 columns wide. Tab shows or hides it either
    # way.
    preview: true
  # How the preview shows a markdown file, such as a README: rendered, as
  # GitHub shows it, or raw, its source. raw on and raw off switch the
  # file open between them.
  markdown: rendered

# The notifications screen and the dashboard's inbox.
notifications:
  # Mark a thread read when the select key opens what it is about, in the
  # app or in the browser. The open key, which opens the thread on GitHub,
  # never marks it read.
  mark_read_on_open: true

# The History modal: the branches of the repository, the graph of one of
# them, and the commit under the graph's cursor.
history:
  # What each row of the graph shows, in this order within its place: the
  # short SHA first, then the subject, then the rest after it, and the age
  # or date at the right edge. Choose from short_sha, subject, author,
  # committer, age, date, verified and trailers. The author and the
  # committer show the GitHub login, or the name without one; age is how
  # long ago the commit was authored, such as 3d; verified marks a
  # verified signature with ✓, and one GitHub couldn't verify with ✗;
  # trailers counts the co-authors.
  row: [short_sha, subject, author, age]
  # What the header of the commit pane shows, in this order. Choose from
  # sha, author, committer, date, verification, parents, trailers, body
  # and stats. When it lists both the author and the committer and they
  # are the same person, with the same name and email, they share one
  # line, where the author is listed; list only one of them to always
  # show just that one.
  detail: [sha, author, committer, date, verification, parents, trailers, body, stats]
  # Show the git email next to each name, and in trailers such as
  # Co-authored-by.
  show_email: false

# The dashboard, the screen the app opens on.
dashboard:
  # The cell of a day in the contribution calendar, on the dashboard and
  # on the page of a user. It must be one cell wide; some terminals draw
  # ■ two cells wide, and "▪" or "#" suit them better.
  calendar_glyph: "■"
  # How far back the contribution calendar goes, on the dashboard and on
  # the page of a user: 30d, 90d or year. Its total counts the days it
  # shows.
  contributions: 90d

# The page of a user or an organization, which :goto @login opens, and
# the owner key opens for what is selected.
owner:
  # What the page opens on: repositories, the Repositories tab; people,
  # the Followers tab of a user and the Members tab of an organization;
  # or readme, the Repositories tab with the focus on the README pane,
  # which a narrow page shows alone.
  default_tab: repositories

# Reading ahead: what the app reads before you open it, so that it opens
# at once. It's a guess, and it spends quota; what was read is kept in the
# cache either way. It has three layers, each setting only what it names:
# these global knobs, then prefetch.<page>, then prefetch.<page>.<kind>,
# one kind of item on that page. A knob a layer leaves out comes from the
# layer above, so enabled: false here turns off every page and kind that
# doesn't enable itself. The pages below that set a window of their own
# (search, finder, history and actions) don't follow the window set here;
# set one of their knobs to null to hand it back to the layer above.
prefetch:
  # Whether anything is read ahead.
  enabled: true
  # The rows around the cursor read once it rests, besides the row under
  # it: before above it, after below it, each 0 to 30. Nearest rows go
  # first, and below before above. 0/0 reads the row under the cursor only.
  window: {before: 1, after: 4}
  # How long the cursor stays on a row before anything is read for it, up
  # to 2s. The window is read again each time it rests.
  rest: 150ms
  # The most reads ahead of rows around the cursors in flight at once, on
  # top of yours, 1 to 10, for every page and modal together. Set here, not
  # per page or kind, since they all share the connection.
  parallel: 3
  # The percent of each hourly quota, GraphQL points and REST requests
  # alike, that reads ahead may spend, 1 to 50. Once they spent it, nothing
  # is read ahead until that quota refills. Apart from it, reads ahead stop
  # while less than 10% of a quota is left, when the status bar turns to
  # warn of it. Global only.
  budget: 10
  # The pages, and the kinds of items on them. Each may set enabled,
  # window and rest. Kinds that read a page at a time (other_tabs,
  # other_kinds) take no window.
  #   pulls: details, comments, checks, other_tabs
  #   issues: details, comments, other_tabs
  #   notifications: details, comments (the dashboard's inbox has one
  #     kind for both, dashboard.inbox, and doesn't follow
  #     notifications.comments)
  #   dashboard: waiting_on_you, inbox, repositories, pinned
  #   search: details, comments, other_kinds
  #   files: tree, preview (window up to 64)
  #   finder: preview
  #   history: commits, branches (windows up to 10)
  #   actions: jobs, logs
  #   owner: people, repositories, other_tabs
  pulls:
    # The full check list of a row costs a GraphQL query, and the rows
    # show how their checks stand already, so it is off. Checks read in
    # the last cache.ttl.actions aren't read again, even while some are
    # pending, unless the row shows a new head; the Checks step polls
    # pending checks once it opens.
    checks: {enabled: false, window: {before: 0, after: 2}}
  dashboard:
    # Waiting on you is read while its pane has the focus, and the inbox
    # while the dashboard is on view. A row costs two requests, the detail
    # and its first comments.
    waiting_on_you: {window: {before: 1, after: 2}}
    # The repositories and pinned panes read, while each has the focus,
    # what opening the repositories around the cursor reads first: the
    # repository and the listing of its default branch, about three
    # requests a repository, and a listing can run to megabytes, so they
    # are off. The repository under the cursor is read only when it is
    # opened. The pinned cards count in the order the pane lists them.
    repositories: {enabled: false, window: {before: 1, after: 1}}
    pinned: {enabled: false, window: {before: 1, after: 1}}
  search:
    window: {before: 0, after: 0}
    other_kinds: {rest: 700ms}
  files:
    tree: {enabled: false}
    preview:
      window: {before: 0, after: 32}
      # The largest file read around the cursor, at most
      # files.preview.max_size; 0 reads no file around it. The file under
      # the cursor is read up to files.preview.max_size.
      max_size: 64KiB
  finder:
    window: {before: 0, after: 0}
    rest: 100ms
    # The finder's preview always reads the file under its cursor, up to
    # files.preview.max_size; max_size bounds the files read around it,
    # and 0 reads none of them.
    preview: {max_size: 64KiB}
  history:
    window: {before: 3, after: 3}
    branches: {window: {before: 0, after: 0}}
  actions:
    # The jobs of the runs around the cursor of the runs: a request a run,
    # or more for a run of over 100 jobs, and none again for a run that
    # ended, whose jobs are kept.
    window: {before: 1, after: 2}
    # The logs of the jobs around the cursor of the jobs: the window counts
    # rows, and only the failed jobs that ended among them are read. A log
    # can run to megabytes, so they are off. The log of the job under the
    # cursor is read once it rests, whatever this says.
    logs: {enabled: false, window: {before: 0, after: 2}}
  owner:
    # The page of each person or organization around the cursor of a list
    # of people: its header, a GraphQL query each, read once the cursor
    # rests, so that enter opens it at once. Off, since most rows are
    # never opened.
    people: {enabled: false, window: {before: 0, after: 2}}
    # As dashboard.repositories, for the repositories and stars tabs and
    # the pinned repositories: about three requests a repository, and the
    # one under the cursor is read only when it is opened.
    repositories: {enabled: false, window: {before: 1, after: 1}}
    # The first page of each tab not on view, a query each, once the page
    # rests on the tab shown. Its first window is read as soon as the list
    # shown loads. Reading the page again reads again only the tabs read
    # before.
    other_tabs: {enabled: false}

# What the app checks of the token.
auth:
  # Refuse at once what the token is known to lack a scope for, rather
  # than asking GitHub, and ask GitHub what the token may do when no
  # answer said so soon after the start. Turn it off if the app ever
  # refuses what the token may do.
  check: true

# How the app talks to GitHub.
github:
  # How long one attempt at a request may take, from sending it until
  # its answer is read, before it is sent again or fails. At least 1s; a
  # server behind a slow VPN may need longer.
  timeout: 30s
  # How many requests are in flight at once at most, 3 to 16. Two of them
  # are kept for what you wait for, so reads ahead never hold those up.
  # A server with tight limits on requests at once wants fewer.
  concurrency: 8

# How many items each page read from GitHub holds, 10 to 100. Smaller
# pages show sooner on a slow connection; larger ones take fewer requests.
page_size:
  # Pull requests, and their comments and reviews.
  pulls: 30
  # The review threads that the detail of a pull request lists. Its counts
  # of resolved, unresolved and outdated threads cover these, so a pull
  # request with more threads says so.
  threads: 50
  # The review requests, and the latest reviews, that the detail of a pull
  # request lists. Its totals say when there are more.
  reviewers: 10
  # The rules of rulesets that the detail of a pull request reads of its
  # base branch, for what stands in the way of merging it.
  rules: 20
  # Issues, and their comments.
  issues: 30
  notifications: 30
  # Your repositories, and the repositories and stars of a user or
  # organization page.
  repos: 30
  # The workflow runs of the Actions modal.
  runs: 30
  # The commits of the History modal.
  commits: 50
  # Each kind of search result.
  search: 20
  # Each list of Waiting on you on the dashboard; its counts cover them
  # all.
  waiting_on_you: 10
  # Each list of people on a user or organization page: followers,
  # following, organizations, members, teams, sponsors and those
  # sponsored.
  people: 50
  # Each page of the pull requests and issues that mention one.
  references: 100

# The command line.
commands:
  # How many of the lines you typed are remembered for each account,
  # across sessions, 1 to 10000.
  history: 100

# The log file, which holds one JSON object per line. The app owns the
# terminal, so nothing is logged anywhere else.
log:
  # The least level logged: debug, info, warn or error. GH_TUI_LOG,
  # --debug and GH_DEBUG override it for one run.
  level: info
  # The log file, an absolute path. Empty means gh-tui/gh-tui.log in your
  # state directory: $XDG_STATE_HOME, or ~/.local/state, also on macOS,
  # and %LocalAppData% on Windows.
  file: ""
  # How large the file grows before it is rotated. At least 64KiB.
  max_size: 10MiB
  # How many rotated files are kept, 0 to 100.
  keep: 3
  # How often a summary of the requests, the caches and the reads ahead is
  # logged. Zero turns these off; one is still logged on exit. Otherwise
  # at least 10s.
  summary: 5m

# The keys of each action, by context, as the terminal names them, such as
# r, R, alt+x, shift+tab, enter, esc, space, pgup or f5; a name the terminal
# has no key for is an error, and so is ctrl+c, which always quits. Setting
# an action replaces its keys only, and [] unbinds it, so that no key does
# it. An action is set under its context, such as keys.pulls.merge, where
# the context is the pane or modal the action works in.
#
# The contexts nest: the global one works everywhere; the context of a
# screen or modal works in each of its panes; and the context of a pane
# works there only. The keys of an outer context are not bound in an inner
# one, so a key is never taken twice: global's r refreshes everywhere, and
# none of the others may bind r. Two contexts that are side by side may
# share a key, such as m for merge in pull requests and read in the
# notifications.
#
# Every pane that moves has the keys that do so in its own context: up and
# down, and left and right in a calendar and in a pane of cards. A list also
# has pages (page_up, page_down and, by half, half_page_up and
# half_page_down) and top and bottom; a calendar has top and bottom too, as
# its first and last day. The work and inbox panes of the dashboard and the
# annotations move up and down only, and a pane of cards has no use for
# pages, top or bottom.
keys:
  # Everywhere. What a key does depends on what has the focus: enter opens
  # a row, applies a filter or answers a question.
  global:
    quit: [q]
    help: ["?"]
    # Open the command line at the bottom of the screen, where commands
    # such as goto are typed. As in vim.
    command: [":"]
    refresh: [r]
    # Show the dashboard, from any screen. 0 sits before the pane keys,
    # as the dashboard comes before the repository.
    dashboard: ["0"]
    # Show the notifications, from any screen.
    notifications: [I]
    # Go back through the pages of users and organizations, then through
    # the screens shown, as a browser does. It does nothing where there
    # is nothing to go back to. Inputs that type still delete with it.
    back: [backspace]
    # Open the search page, with the focus in an empty query, even when
    # the page is on view already.
    search: [S]
    # Choose or open what is under the cursor.
    select: [enter]
    # Dismiss, one step at a time: an error toast first, then what is
    # transient, such as a filter or a search, and then the modal that is
    # open. On a screen it does nothing. It never unzooms a pane: the zoom
    # key does.
    dismiss: [esc]
    # Open what is under the cursor in the browser.
    open: [o]
    # Show the page of the person or organization behind what is selected:
    # the author of a pull request or issue, the owner of a repository or
    # of what is in it, such as a file or a notification, or an
    # organization of the dashboard's Repositories pane. Your own login
    # shows the dashboard.
    owner: ["@"]
    # Show the repository of what is selected: of a result of the search, a
    # pinned card, a row of the dashboard's Repositories, a task of its
    # Work or a notification of its inbox or of the notifications screen,
    # a row of the page of a user or an organization, or the repository
    # its README comes from. It does nothing where nothing is selected,
    # the selection has no repository, or it is the repository on view.
    repo: ["."]
    # Open the file finder of the repository screen, which finds a file by
    # some letters of its path, or in the modal of a pull request, the
    # finder of the files it changes, which shows the diff of the one
    # chosen. ctrl+p is the key of editors.
    find_file: [ctrl+p]
    # Show the focused pane of the dashboard, the repository screen, the
    # page of a user or an organization, or a modal such as Actions,
    # alone, or all of them again.
    zoom: [z]
    # Toggle the open modal between its size and the whole screen. It is
    # typed, not taken, while an input has the keys.
    maximize: [Z]
    # Cycle the focus through the panes of the screen, or of a modal with
    # panes.
    next_pane: [tab]
    prev_pane: [shift+tab]
    # Switch between the tabs of the focused pane or modal, such as the kinds
    # of the search page, All, Failing, Running and Mine of the Actions
    # modal, the states of the pull requests and the issues, the owners of
    # the dashboard's repositories, the lists of the page of a user or an
    # organization, and the Filters and Sort tabs of the filter modal.
    next_tab: ["]"]
    prev_tab: ["["]
    # Focus the pane with that number on the screen or modal on view: files,
    # pull requests and issues on the repository screen; pinned,
    # repositories, work, contributions and notifications on the dashboard;
    # pinned, the list, the README and a user's contributions on the page of
    # a user or an organization; the query and the results on the search
    # page; branches, graph and commit in History; the files and the diff on
    # the Files tab of a pull request; and runs, jobs and log in Actions. A
    # digit with no such pane there does nothing, and never switches screens.
    pane_1: ["1"]
    pane_2: ["2"]
    pane_3: ["3"]
    pane_4: ["4"]
    pane_5: ["5"]

  # Dashboard: the pinned repositories, as cards.
  dashboard_pinned:
    up: [up, k]
    down: [down, j]
    left: [left, h]
    right: [right, l]

  # Dashboard: your repositories, and those of each organization.
  dashboard_repos:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    # Search the rows of the list for text, show only the rows that hold
    # it, and step between the rows a search found.
    find: [/]
    quick_filter: ["&"]
    next_match: [n]
    prev_match: [N]
    # Open the filter modal on its Filters tab or its Sort tab, and put the
    # filters back to their defaults.
    filter: [f]
    sort: [s]
    clear_filter: [F]
  # Dashboard: the pull requests and issues waiting on you.
  dashboard_work:
    up: [up, k]
    down: [down, j]
    # Show the checks of the pull request under the cursor.
    checks: [C]
  # Dashboard: your contributions, a day at a time.
  dashboard_calendar:
    up: [up, k]
    down: [down, j]
    left: [left, h]
    right: [right, l]
    top: [g, home]
    bottom: [G, end]
  # Dashboard: your newest notifications.
  dashboard_inbox:
    up: [up, k]
    down: [down, j]

  # The repository screen, on any of its panes.
  repo:
    # Open the History modal.
    history: [B]
    # Open the Actions modal.
    actions: [A]
    # Star the repository, or unstar it. Reserved, without a key, and does
    # nothing yet.
    star: []
  # Repository: the file tree.
  files:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    # Expand the directory under the cursor, or go to its first entry when
    # it is open; on a file, preview it as the select key does. Collapse a
    # directory, or go to its parent from an entry or a closed directory.
    # The toggle expands every directory, or collapses them all when all
    # are expanded.
    expand: [right, l]
    collapse: [left, h]
    toggle_all: ["*"]
    # Show the files at the head of the default branch again, after
    # history's base chose another one.
    reset_base: [H]
  # Repository: the pull requests.
  pulls:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    # Search the rows of the list for text, show only the rows that hold
    # it, and step between the rows a search found.
    find: [/]
    quick_filter: ["&"]
    next_match: [n]
    prev_match: [N]
    # Open the filter modal on its Filters tab or its Sort tab, and put the
    # filters back to their defaults.
    filter: [f]
    sort: [s]
    clear_filter: [F]
    # Mark the pull request under the cursor, or unmark it. Esc unmarks
    # them all, after it has cleared a search and a quick filter. While
    # some are marked, close, reopen and draft act on all of them, with one
    # question that says how many are left out; merge still acts on the
    # one under the cursor.
    mark: [space]
    # Merge the pull request, asking first and naming the method and the
    # base branch. The method is stepped through with confirm.method. It
    # does what suits the pull request: it merges at once; or, while its
    # checks are pending and the repository allows auto-merge, asks to
    # merge once they pass; or adds it to the merge queue of a base branch
    # that has one; or, with auto-merge already on, asks to turn it off.
    # When it can't merge, it says why and asks nothing.
    merge: [M]
    close: [X]
    reopen: [O]
    # Mark the pull request ready for review, or as a draft.
    draft: [W]
    # Show the checks of the pull request.
    checks: [C]
  # Repository: the issues.
  issues:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    # Search the rows of the list for text, show only the rows that hold
    # it, and step between the rows a search found.
    find: [/]
    quick_filter: ["&"]
    next_match: [n]
    prev_match: [N]
    filter: [f]
    sort: [s]
    clear_filter: [F]
    # Mark the issue under the cursor, or unmark it. Esc unmarks them all,
    # after it has cleared a search and a quick filter. While some are
    # marked, close and reopen act on all of them, with one question that
    # says how many are left out.
    mark: [space]
    close: [X]
    reopen: [O]
    comment: [c]
    labels: [L]

  # The notifications screen.
  notifications:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    # Search the rows of the list for text, show only the rows that hold
    # it, and step between the rows a search found.
    find: [/]
    quick_filter: ["&"]
    next_match: [n]
    prev_match: [N]
    filter: [f]
    clear_filter: [F]
    # Mark the notification under the cursor, or unmark it. Esc unmarks
    # them all, after it has cleared a search and a quick filter. While
    # some are marked, read and done act on all of them, with one question
    # that says how many are left out.
    mark: [space]
    read: [U]
    done: [D]
    read_all: [M]

  # The search page, on any of its panes. It opens on the query in normal
  # mode, where these keys and the global ones work.
  search:
    # Start typing in the query.
    insert: [i]

  # Search: the results.
  search_results:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    # Search the rows of the list for text, show only the rows that hold
    # it, and step between the rows a search found.
    find: [/]
    quick_filter: ["&"]
    next_match: [n]
    prev_match: [N]
    filter: [f]
    sort: [s]
    # Show the checks of the pull request under the cursor.
    checks: [C]

  # The page of a user or an organization: its pinned repositories, as
  # cards.
  owner_pinned:
    up: [up, k]
    down: [down, j]
    left: [left, h]
    right: [right, l]
  # The page of a user or an organization: its list.
  owner_list:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    # Search the rows of the list for text, show only the rows that hold
    # it, and step between the rows a search found.
    find: [/]
    quick_filter: ["&"]
    next_match: [n]
    prev_match: [N]
    filter: [f]
    sort: [s]
    clear_filter: [F]
  # The page of a user: its contributions, a day at a time.
  owner_calendar:
    up: [up, k]
    down: [down, j]
    left: [left, h]
    right: [right, l]
    top: [g, home]
    bottom: [G, end]

  # The modal of a pull request, on any of its steps.
  pull_modal:
    # As in the list.
    merge: [M]
    close: [X]
    reopen: [O]
    draft: [W]
    # Show the checks of the pull request.
    checks: [C]
    # Show the issues and pull requests linked to it, over the tab on view,
    # and those that mention it. Quoted, since an unquoted # starts a
    # comment.
    references: ["#"]
  # Checks: the list of checks. Each pane of the step re-runs the failed
  # jobs of the run of the check under the cursor, or of the one shown.
  pull_check_list:
    rerun_failed: [R]
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
  # Checks: the log of the job of a check, and its annotations. Move the
  # focus between the two.
  pull_check_log:
    rerun_failed: [R]
    annotations: [A]
    up: [up, k]
    down: [down, j]
    left: [left, h]
    right: [right, l]
    page_up: [b, ctrl+b, pgup]
    page_down: [space, ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    toggle_all: ["*"]
    option: ["-"]
    next_error: [e]
    prev_error: [E]
    next_warning: [w]
    prev_warning: []
    follow: [F]
    find: [/]
    next_match: [n]
    prev_match: [N]
  pull_check_annotations:
    rerun_failed: [R]
    up: [up, k]
    down: [down, j]
    annotations: [A]

  # The modal of an issue.
  issue_modal:
    close: [X]
    reopen: [O]
    comment: [c]
    labels: [L]
    # Show the issues and pull requests linked to it, and those that mention
    # it.
    references: ["#"]
    up: [up, k]
    down: [down, j]
    page_up: [b, ctrl+b, pgup]
    page_down: [space, ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]

  # The links of a pull request or an issue: what it closes or is closed by,
  # what its texts write, and what mentions it, in groups that fold. Enter
  # opens an item in place of the modal, and backspace comes back to the
  # links.
  references:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    # Expand the group under the cursor, or go to its first item when it is
    # open; on an item, open it as the select key does. Collapse a group, or
    # go to its group from an item. The toggle expands every group, or
    # collapses them all when all are expanded.
    expand: [right, l]
    collapse: [left, h]
    toggle_all: ["*"]
    # Show only the items that hold the words typed, wherever they are in a
    # row: the number, the title, how the item stands, or who linked it.
    quick_filter: ["&"]

  # The History modal, on any of its panes.
  history:
    reset_base: [H]
  # History: the branches. Show the files at the branch under the cursor.
  history_branches:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    # Narrow the branches by typing a part of a name.
    filter: [f]
    base: [b]
  # History: the commit graph. Show the files at the commit under the
  # cursor.
  history_graph:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    base: [b]
  # History: the files of a commit. Show the files at the commit.
  history_files:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    base: [b]

  # The Actions modal, on any of its panes.
  actions:
    # Re-run the failed jobs of a run, or all of its jobs, and cancel it.
    rerun_failed: [R]
    rerun: []
    cancel: [X]
  # Actions: the runs.
  actions_runs:
    # Open the filter of the runs, and clear it.
    filter: [f]
    clear_filter: [F]
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    # Search the rows of the list for text, show only the rows that hold
    # it, and step between the rows a search found.
    find: [/]
    quick_filter: ["&"]
    next_match: [n]
    prev_match: [N]
  # Actions: the jobs of a run. Re-run the job under the cursor.
  actions_jobs:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    rerun_job: [J]
  # Actions: the log of a job. Re-run the job, and move the focus between
  # the log and the annotations of the job.
  actions_log:
    rerun_job: [J]
    annotations: [A]
    up: [up, k]
    down: [down, j]
    left: [left, h]
    right: [right, l]
    page_up: [b, ctrl+b, pgup]
    page_down: [space, ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    toggle_all: ["*"]
    option: ["-"]
    next_error: [e]
    prev_error: [E]
    next_warning: [w]
    prev_warning: [W]
    follow: [F]
    find: [/]
    next_match: [n]
    prev_match: [N]
  # Actions: the annotations of a job, with the same keys as its log.
  actions_annotations:
    up: [up, k]
    down: [down, j]
    rerun_job: [J]
    annotations: [A]

  # The readers: the keys that scroll and search a text, in the modals
  # and panes that show one.
  # A file shown in full, from the tree, the finder, a code search hit or
  # an annotation.
  preview:
    up: [up, k]
    down: [down, j]
    left: [left, h]
    right: [right, l]
    page_up: [b, ctrl+b, pgup]
    page_down: [space, ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    option: ["-"]
    find: [/]
    quick_filter: ["&"]
    next_match: [n]
    prev_match: [N]
    edit: [v]
  # The text that :config and :images show.
  text:
    up: [up, k]
    down: [down, j]
    left: [left, h]
    right: [right, l]
    page_up: [b, ctrl+b, pgup]
    page_down: [space, ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    option: ["-"]
    find: [/]
    quick_filter: ["&"]
    next_match: [n]
    prev_match: [N]
    edit: [v]
  # History: the patch of a file.
  history_patch:
    up: [up, k]
    down: [down, j]
    left: [left, h]
    right: [right, l]
    page_up: [b, ctrl+b, pgup]
    page_down: [space, ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    option: ["-"]
    find: [/]
    quick_filter: ["&"]
    next_match: [n]
    prev_match: [N]
    edit: [v]
  # The page of a user or an organization: the README, which scrolls and
  # leaves the rest of a pager's keys to the full pagers.
  owner_readme:
    up: [up, k]
    down: [down, j]
    page_up: [b, ctrl+b, pgup]
    page_down: [space, ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
  # The modal of a pull request: the conversation.
  pull_conversation:
    up: [up, k]
    down: [down, j]
    page_up: [b, ctrl+b, pgup]
    page_down: [space, ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
  # The modal of a pull request: the tree of the files it changes.
  # Expand and collapse fold its directories; enter or expand on a file
  # shows its diff.
  pull_files:
    up: [up, k]
    down: [down, j]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    expand: [right, l]
    collapse: [left, h]
    toggle_all: ["*"]
  # The modal of a pull request: the diff of the files it changes. Enter
  # folds the file whose header the cursor is on.
  pull_diff:
    up: [up, k]
    down: [down, j]
    left: [left, h]
    right: [right, l]
    page_up: [b, ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    next_file: [J]
    prev_file: [K]
    next_hunk: ["}"]
    prev_hunk: ["{"]
    # Search the lines of every file of the diff, and move between matches.
    find: [/]
    next_match: [n]
    prev_match: [N]
  # The modal of a release.
  release_modal:
    up: [up, k]
    down: [down, j]
    page_up: [b, ctrl+b, pgup]
    page_down: [space, ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
  # Checks: what an app reported.
  pull_check_detail:
    up: [up, k]
    down: [down, j]
    left: [left, h]
    right: [right, l]
    page_up: [b, ctrl+b, pgup]
    page_down: [space, ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]

  # What the search prompt of a pager or a log takes: enter searches, esc
  # closes it, and so do these keys on an empty line (a pager only).
  search_prompt:
    run: [enter]
    cancel: [esc]
    cancel_empty: [backspace, ctrl+h]
  # What names an option after a pager's option key, as less's - does.
  pager_option:
    chop: [S]
    line_numbers: [N]
    squeeze: [s]
    smart_case: [i]
    ignore_case: [I]
    cancel: [esc]
  # What names an option after a log's option key, as less's - does: chop or
  # wrap long lines, show line numbers, and show timestamps.
  log_option:
    chop: [S]
    line_numbers: [N]
    timestamps: [T]
    cancel: [esc]

  # The filter form of a list, in the rows: the keys that move between
  # and change the fields, on top of the global ones that apply, close and
  # switch the tabs. The filter of the Actions runs has the same keys.
  filter:
    up: [k, up]
    down: [j, down]
    top: [g, home]
    bottom: [G, end]
    left: [h, left]
    right: [l, right]
    # Flip a toggle, open the dropdown of a field, or check an item.
    toggle: [space]
    # Start typing in a text field or the query line, with the cursor at
    # the start or at the end.
    insert: [i]
    append: [a]
    # Clear the field in focus. Backspace is the global back key.
    clear: [delete]
  actions_filter:
    up: [k, up]
    down: [j, down]
    top: [g, home]
    bottom: [G, end]
    left: [h, left]
    right: [l, right]
    toggle: [space]
    insert: [i]
    append: [a]
    clear: [delete]

  # Widgets that take every key while they are open. They may use keys
  # that the contexts above use. Those that type, type every printable key
  # they don't bind, so a key of theirs is a control key, or one with ctrl
  # or alt.
  # The command line. ctrl+c cancels it too, which can't be set.
  command_line:
    run: [enter]
    cancel: [esc]
    cancel_empty: [ctrl+h]
    complete: [tab]
    complete_prev: [shift+tab]
    older: [up, ctrl+p]
    newer: [down, ctrl+n]
  # The help.
  help:
    up: [up]
    down: [down]
    page_up: [pgup]
    page_down: [pgdown]
    top: [home]
    bottom: [end]
    # Find the keys that hold the next key pressed.
    capture: [tab]
    # Close the help while its query is empty; otherwise it is typed.
    close: ["?"]
    # Clear the query, then close.
    cancel: [esc]
  # A question that waits for yes or no.
  confirm:
    # Step through the choices of a question that has them. Only the
    # question to merge a pull request does, with the methods the
    # repository allows; elsewhere the key does nothing.
    method: [tab]
    "yes": [y]
    "no": [n, esc]
  # A prompt, such as the composer of a comment.
  prompt:
    submit: [ctrl+s]
    # Also submits a prompt of one line.
    submit_line: [enter]
    cancel: [esc]
  # The file finder.
  finder:
    up: [up, ctrl+p]
    down: [down, ctrl+n]
    page_up: [pgup]
    page_down: [pgdown]
    choose: [enter]
    cancel: [esc]
    # Show the file under the cursor in the tree, and preview it.
    reveal: [ctrl+t]
    preview: [tab]
  # A picker whose filter has the keys, and a dropdown's list. While the
  # filter of a filter form's dropdown types, its up and down are those of
  # filter_query.
  picker:
    up: [up, ctrl+p]
    down: [down, ctrl+n]
    page_up: [pgup]
    page_down: [pgdown]
    choose: [enter]
    cancel: [esc]
    # Check or uncheck the item under the cursor of a dropdown with
    # several choices.
    toggle: [space]
    next_scope: [tab]
    prev_scope: [shift+tab]
  # A picker in normal mode, where the keys move and open the filter
  # instead of being typed.
  picker_normal:
    up: [k, up]
    down: [j, down]
    page_up: [ctrl+b, pgup]
    page_down: [ctrl+f, pgdown]
    half_page_up: [ctrl+u]
    half_page_down: [ctrl+d]
    top: [g, home]
    bottom: [G, end]
    # Start typing in the filter, with the cursor at the start or at the
    # end.
    insert: [i]
    append: [a]
  # The query of the search page while it types. Esc is the way out: it
  # stops typing and moves to the results.
  search_query:
    submit: [enter]
    cancel: [esc]
  # The query line of the filter form, and the editor of a text field,
  # which type.
  filter_query:
    apply: [enter]
    cancel: [esc]
    up: [up, ctrl+p]
    down: [down, ctrl+n]

# Named palettes, each with a variant for light and dark terminals. A
# theme you add needs every colour of both variants; to change the default
# theme, set only the colours you change. The colours: accent marks the
# focused element, selections and links; foreground is the main text;
# muted is for secondary text such as metadata; subtle for the faintest
# text, such as hints and placeholders; border for borders and separators.
themes:
  default:
    light:
      accent: "#3b63c4"
      foreground: "#1f2330"
      muted: "#545b6e"
      subtle: "#8a90a0"
      border: "#d3d7e0"
      success: "#2f7d4f"
      warning: "#9a6700"
      error: "#c0392b"
    dark:
      accent: "#7aa2f7"
      foreground: "#d8dce6"
      muted: "#a0a7b8"
      subtle: "#6b7285"
      border: "#3a3f4d"
      success: "#7fc99a"
