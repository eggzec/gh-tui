name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Build and test as the release builds, without cgo.
env:
  CGO_ENABLED: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The race detector is the one thing here that needs cgo.
      - run: go test -race ./...
        env:
          CGO_ENABLED: "1"
      - run: go test -run '^$' -bench . -benchtime 100x ./...

  # What the client sends, against GitHub's schemas of github.com and of
  # the oldest supported GitHub Enterprise Server (core.MinEnterprise). A
  # job of its own, so that a deprecation upstream, or a download that
  # fails, shows as this job failing, not the tests.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # GitHub's schemas, downloaded afresh each week, or for a new oldest
      # supported GitHub Enterprise Server.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/schemas
          key: schemas-${{ steps.week.outputs.week }}-${{ hashFiles('internal/core/enterprise.go') }}
      - run: go test -tags schemacheck -run '^TestSchema$' ./internal/github/
        env:
          GH_TUI_SCHEMAS: ${{ runner.temp }}/schemas
          GITHUB_TOKEN: ${{ github.token }}

  # Build every platform the release ships without cgo, so a dependency that
  # needs cgo, or builds on one OS only, fails here first. The list is
  # cli/gh-extension-precompile's, in its build_and_release.sh.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          for p in darwin/amd64 darwin/arm64 freebsd/386 freebsd/amd64 \
            freebsd/arm64 linux/386 linux/amd64 linux/arm linux/arm64 \
            windows/386 windows/amd64 windows/arm64; do
            echo "$p"
            GOOS=${p%/*} GOARCH=${p#*/} go build -o /dev/null ./cmd/gh-tui
          done
