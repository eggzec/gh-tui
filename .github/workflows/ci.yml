name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Build and test as the release builds, without cgo.
env:
  CGO_ENABLED: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The race detector is the one thing here that needs cgo. -count=1
      # runs every test rather than report a result kept in the build cache.
      - run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"

  # The benchmarks, run a fixed number of times so they finish, and so that
  # one that breaks or turns very slow fails here. A job of its own, so it
  # runs beside the tests instead of after them.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -bench . -benchtime 100x ./...

  # What the client sends, against GitHub's schemas of github.com and of
  # the oldest supported GitHub Enterprise Server (core.MinEnterprise). A
  # job of its own, so that a deprecation upstream, or a download that
  # fails, shows as this job failing, not the tests.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # GitHub's schemas, downloaded afresh each week, or for a new oldest
      # supported GitHub Enterprise Server.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/schemas
          key: schemas-${{ steps.week.outputs.week }}-${{ hashFiles('internal/core/enterprise.go') }}
      - run: go test -tags schemacheck -count=1 -run '^TestSchema$' ./internal/github/
        env:
          GH_TUI_SCHEMAS: ${{ runner.temp }}/schemas
          GITHUB_TOKEN: ${{ github.token }}

  # Build every platform the release ships without cgo, so a dependency that
  # needs cgo, or builds on one OS only, fails here first. The list is
  # cli/gh-extension-precompile's, in its build_and_release.sh.
  #
  # cross keeps its own module and build cache, since it builds for platforms
  # no other job does, and setup-go's cache is one for all jobs, saved by
  # whichever finishes first. Go's build cache is content-addressed, so a
  # stale cache can only cost a rebuild; go.mod's hash covers the Go version.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-cross-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
      - run: |
          for p in darwin/amd64 darwin/arm64 freebsd/386 freebsd/amd64 \
            freebsd/arm64 linux/386 linux/amd64 linux/arm linux/arm64 \
            windows/386 windows/amd64 windows/arm64; do
            echo "$p"
            GOOS=${p%/*} GOARCH=${p#*/} go build -o /dev/null ./cmd/gh-tui
          done
