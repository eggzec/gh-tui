version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - intrange
    - misspell
    - modernize
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      # Bubbles are values by convention; styles make them large.
      disabled-checks:
        - hugeParam
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
    goimports:
      local-prefixes:
        - github.com/eggzec/gh-tui
